# Draft reference workflow, from spike 003 (specs/003-definition-model-draft/).
# The schema is described in schema.md; a worked score is in example-run.md.
# The engine assigns the version number when a human publishes this file.
# Updated by spike 010 (Q26, Q27): git is the evidence channel, so the driver submits no
# evidence; the runner reads the subject at the request's revision. Jev is the only provider.
# Q28: the shadow typed decision on code_quality is a decision tree.

schema: ai-workflow/v0
workflow: sdlc-reference
title: SDLC reference workflow
description: >
  A small software change: write requirements, implement them, verify the change,
  and merge it. Exists to exercise the framework, not to model a real process.

required_capabilities: [core, activity_recording, enforcement]

run_inputs:
  repository: { description: Repository the change is made in. }
  branch: { description: Branch the change is made on and merged from. }
  base: { description: Branch the change is compared against and merged into. }
  task: { description: What to build, in the requester's words. }

# What the runner reads from the subject, at the request's revision. The engine substitutes the
# templates and passes the values on without interpreting them; the runner's source adapter
# resolves them. The UI renders `view` as a link for humans.
subject:
  base: "{{inputs.base}}"
  inputs:
    requirements: { file: "docs/requirements/{{inputs.branch}}.md" }
    diff: { diff: base }
  view: "https://github.com/{{inputs.repository}}/compare/{{inputs.base}}...{{revision}}"

typed_questions:
  code_quality_band:
    prompt: Which band of the code quality rubric does this change fall in?
    labels: [poor, weak, good, exemplary]
    inputs: [requirements, diff]
  has_defect:
    # The narrow question from spike 007's battery, which separated good and flawed code.
    type: noul
    prompt: The change contains a correctness defect that the requirements or a test would expose.
    inputs: [requirements, diff]

protected_actions:
  merge:
    description: Merge the run's branch into the target branch.
    allowed_in: [release]

scoring:
  # Subtracted from the normalized 0-100 score, as separate line items.
  deductions:
    failed_attempt: 5   # per failed attempt of a required step, even if later overridden
    rework_loop: 5      # per traversal of a rework edge

stages:
  requirements:
    entry: true
    task:
      prompt: "Write requirements for this task in {{inputs.repository}}, commit them to docs/requirements/{{inputs.branch}}.md on {{inputs.branch}}, and push: {{inputs.task}}"
      acceptance_criteria:
        - Every requirement is testable.
        - Each acceptance criterion is a single sentence.
        - The requirements file is committed and pushed.
      limits: { iterations: 5, wall_time: 1h, failed_checks: 3 }

  implementation:
    task:
      prompt: "Implement docs/requirements/{{inputs.branch}}.md on branch {{inputs.branch}}."
      acceptance_criteria:
        - Meets the acceptance criteria in the requirements file.
        - The code builds and the tests touched by the change pass.
      limits: { iterations: 12, wall_time: 3h, failed_checks: 3 }

  verification:
    task:
      prompt: "Run the full test suite locally against the change, then push {{inputs.branch}} and name the revision. Do not change the code."
      acceptance_criteria:
        - The full test suite ran to the end locally.
        - The branch is pushed, so the runner can fetch the revision.
      limits: { iterations: 4, wall_time: 1h, failed_checks: 2 }

  release:
    task:
      prompt: "Merge {{inputs.branch}} into {{inputs.base}} with a merge commit."
      acceptance_criteria:
        - The merge succeeded and {{inputs.base}} contains the reviewed revision.
      limits: { iterations: 3, wall_time: 30m, failed_checks: 2 }

  complete:
    terminal: success

  discarded:
    terminal: failure

transitions:
  - id: start_implementation
    from: requirements
    to: implementation
    checkpoint:
      label: stage check
      steps:
        - id: requirements_present
          executor: deterministic
          runs_in: runner
          role: required
          points: 0
          check:
            command:
              image: "alpine/git@sha256:<digest>"
              run: [test, -s, "docs/requirements/{{inputs.branch}}.md"]
              timeout: 2m

  - id: verify
    from: implementation
    to: verification

  - id: approve_release
    from: verification
    to: release
    checkpoint:
      label: major
      steps:
        - id: diff_present
          executor: deterministic
          runs_in: runner
          role: required
          points: 0
          check:
            command:
              image: "alpine/git@sha256:<digest>"
              # Fails when the revision changes nothing against the base.
              run: [sh, -c, '! git diff --quiet "origin/$BASE"...HEAD']
              env: { BASE: "{{inputs.base}}" }
              timeout: 2m

        - id: tests_green
          executor: deterministic
          runs_in: runner
          role: required
          points: 10
          check:
            command:
              # Built from the Dockerfile next to this file; digest set when the image is built.
              image: "sample-crm-check@sha256:<digest>"
              run: [./mvnw, -B, verify]
              env:
                SPRING_DATASOURCE_URL: "jdbc:postgresql://localhost:5432/crm"
                SPRING_DATASOURCE_USERNAME: crm
                SPRING_DATASOURCE_PASSWORD: crm
              services:
                postgres:
                  image: "postgres:18-alpine@sha256:<digest>"
                  env:
                    POSTGRES_DB: crm
                    POSTGRES_USER: crm
                    POSTGRES_PASSWORD: crm
                  ready: { command: [pg_isready, -U, crm, -d, crm] }
              timeout: 15m

        - id: code_quality
          executor: agent_evaluator
          runs_in: runner
          role: required
          points: 20
          council: 3
          inputs: [requirements, diff]
          instructions: Judge the change against the requirements, not against your own design.
          scale: [1, 10]
          pass: { min_score: 6 }
          rubric:
            - id: poor
              range: [1, 3]
              descriptor: Does not meet the requirements, or is unreadable.
            - id: weak
              range: [4, 5]
              descriptor: Meets most requirements, with clear correctness or structure problems.
            - id: good
              range: [6, 8]
              descriptor: Meets the requirements; readable, with minor issues only.
            - id: exemplary
              range: [9, 10]
              descriptor: Meets the requirements; idiomatic, well-factored, and easy to extend.
          typed_decisions:
            - question: code_quality_band
              provider: jev
              mode: shadow
              then:                       # a decision tree; first matching branch wins
                - when: { label_in: [poor, weak] }
                  ask: has_defect
                  then:
                    - when: { label_in: ["true"], min_confidence: 0.7 }
                      conclude: likely_defect
                - when: { max_confidence: 0.5 }
                  ask: has_defect
                  then:
                    - when: { label_in: ["true"], min_confidence: 0.7 }
                      conclude: likely_defect

        - id: docs_updated
          executor: agent_evaluator
          runs_in: runner
          role: optional
          points: 5
          inputs: [requirements, diff]
          scale: [1, 5]
          rubric:
            - id: none
              range: [1, 1]
              descriptor: No documentation change where one was needed.
            - id: partial
              range: [2, 3]
              descriptor: Some documentation updated; gaps remain.
            - id: complete
              range: [4, 5]
              descriptor: Documentation matches the change, or none was needed.

        - id: release_approval
          executor: human
          role: required
          points: 0
          separation_of_duties: true
          prompt: "Approve merging {{inputs.branch}} into {{inputs.base}} in {{inputs.repository}}? Review the change through the subject view."

  - id: rework
    from: verification
    to: implementation
    rework: true

  - id: discard
    from: verification
    to: discarded

  - id: finish
    from: release
    to: complete
    checkpoint:
      label: stage check
      steps:
        - id: merge_recorded
          executor: deterministic
          runs_in: runner
          role: required
          points: 0
          check:
            command:
              image: "alpine/git@sha256:<digest>"
              # Holds when the base branch contains the revision the release checkpoint reviewed.
              run: [git, merge-base, --is-ancestor, "{{revision}}", "origin/{{inputs.base}}"]
              timeout: 2m
