# The UI: static files served by nginx.
---
apiVersion: v1
kind: Service
metadata: {name: ui, namespace: awf}
spec:
  selector: {app: ui}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ui, namespace: awf}
spec:
  replicas: 1
  selector: {matchLabels: {app: ui}}
  template:
    metadata: {labels: {app: ui}}
    spec:
      containers:
        - name: ui
          image: awf/ui
          ports: [{containerPort: 80}]
          resources: {limits: {cpu: 200m, memory: 64Mi}}
