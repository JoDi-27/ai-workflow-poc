# One localhost origin through Envoy Gateway (Gateway API), plus the collector on 4318 (spike 014 Q4, Q15).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: awf, namespace: awf}
spec:
  gatewayClassName: GATEWAY_CLASS          # set by the overlay
  listeners:
    - {name: http, protocol: HTTP, port: 80}
    - {name: otlp, protocol: HTTP, port: 4318}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: awf, namespace: awf}
spec:
  parentRefs: [{name: awf, sectionName: http}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /mcp}}]
      backendRefs: [{name: mcp-gateway, port: 8080}]
    - matches: [{path: {type: PathPrefix, value: /v1}}]
      backendRefs: [{name: engine, port: 8080}]
    - matches: [{path: {type: PathPrefix, value: /analysis}}]
      backendRefs: [{name: analysis, port: 8080}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: ui, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: otlp, namespace: awf}
spec:
  parentRefs: [{name: awf, sectionName: otlp}]
  rules:
    - backendRefs: [{name: collector, port: 4318}]
