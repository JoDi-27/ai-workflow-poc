# Local PostgreSQL for running the engine from the terminal (engine/README.md). Local only: the
# password is not a secret. In the cluster, PostgreSQL comes from deploy/.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: awf
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d awf"]
      interval: 2s
      retries: 30
    volumes:
      - engine-pgdata:/var/lib/postgresql
volumes:
  engine-pgdata:
